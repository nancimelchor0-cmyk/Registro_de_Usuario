<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro_de_Usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Crea tu cuenta</h1>
    </header>

    <main>
        <form id="registroForm">
            <div class="perfil-container">
                <img src="https://via.placeholder.com/100" alt="Foto de perfil" id="preview">
                <input type="file" id="fotoPerfil" accept="image/*">
            </div>

            <label for="password">Contraseña (mínimo 8 caracteres):</label>
            <input type="password" id="password" minlength="8" required>

            <label for="fechaNacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fechaNacimiento" required>

            <label for="colorFavorito">Color Favorito:</label>
            <input type="color" id="colorFavorito" value="#4a90e2">

            <label for="pais">País:</label>
            <input list="paises" id="pais" name="pais" placeholder="Escribe tu país...">
            <datalist id="paises">
                <option value="México">
                <option value="España">
                <option value="Argentina">
                <option value="Colombia">
                <option value="Chile">
            </datalist>

            <button type="submit">Registrarse</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2024 Mi Proyecto Responsivo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
